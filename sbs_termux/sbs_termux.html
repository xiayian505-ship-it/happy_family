<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2ea"><title>慢慢終端機｜Termux 指令本</title><link rel="stylesheet" href="sbs_termux.css"><link rel="stylesheet" href="sbs_termux_style.css"><script defer src="https://lib.stillnessbyslowly.com/ui/clipboard/clipboard_copy.js"></script><script defer src="https://lib.stillnessbyslowly.com/ui/toast.js"></script><script defer src="sbs_termux.js"></script><script defer src="sbs_termux_style.js"></script></head><body><div class="shell"><header><div><span class="eyebrow">STILLNESS BY SLOWLY · TOOLS</span><h1>慢慢終端機<span class="small">／Termux 指令本</span></h1><p>選專案、看指令、整段複製。網站不會執行任何終端機指令。</p></div><span class="header-mark">⌘</span></header><main><section class="workspace" aria-labelledby="project-title"><div class="section-head"><div><span class="eyebrow">01 / WORKSPACE</span><h2 id="project-title">目前專案</h2></div><span class="hint">只儲存在這台瀏覽器</span></div><div class="project-controls"><label>切換專案<select id="project-select"></select></label><button type="button" class="subtle" id="add-project">＋ 新增</button><button type="button" class="subtle" id="edit-project">編輯</button><button type="button" class="subtle danger" id="remove-project">刪除</button></div><div class="pathline"><span id="project-path"></span><button type="button" class="copy-small" id="copy-path">複製路徑</button></div><p class="notice">專案路徑可自行修改；指令會依目前選取的專案產生。執行前請確認目錄及分支。</p></section><section class="command-area" aria-labelledby="commands-title"><div class="section-head"><div><span class="eyebrow">02 / COMMANDS</span><h2 id="commands-title">常用指令</h2></div><span id="result-count" class="hint"></span></div><div class="search-row"><label class="search-label"><span class="sr-only">搜尋指令</span><input id="search" type="search" placeholder="搜尋：切換、狀態、提交、推送…" autocomplete="off"></label><button type="button" class="subtle" id="reset-search">清除</button></div><nav id="category-nav" class="categories" aria-label="指令分類"></nav><div id="command-list" class="command-list"></div><p id="empty" class="empty" hidden>沒有符合的指令，試試其他關鍵字。</p></section></main><footer>慢 慢 <span>｜</span> Stillness by Slowly · 複製前看清楚，執行前再確認。</footer></div><dialog id="project-dialog"><form id="project-form"><div class="dialog-head"><h2 id="dialog-title">新增專案</h2><button type="button" class="icon-button" id="close-dialog" aria-label="關閉">×</button></div><label>專案名稱<input id="project-name" required maxlength="60" placeholder="例如 happy_family"></label><label>Termux 專案絕對路徑<input id="project-directory" required spellcheck="false" placeholder="例如 ~/storage/shared/Projects/happy_family"></label><p class="notice">路徑不要包含換行或引號。此網站不會檢查手機上是否真的存在該目錄。</p><div class="dialog-actions"><button type="button" class="subtle" id="cancel-dialog">取消</button><button type="submit" class="primary">儲存專案</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
