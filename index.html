<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Family</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
    }

    main {
      width: min(90%, 720px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 4rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Happy Family</h1>
    <p>想到什麼，就放進來。</p>
  </main>
</body>
</html>
