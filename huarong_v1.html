<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SBS | HUARONG_V1</title>

  <!-- 慢慢的倉庫 -->
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/toast.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/feedback/press.css">

  <link rel="stylesheet" href="./huarong_v1.css">
</head>

<body>
  <main class="wrap">
    <header class="page-head">
      <div>
        <h1>SBS | HUARONG_V1</h1>
        <p class="sub">華容道・橫刀立馬</p>
      </div>
      <div class="step-label">步數 <b id="moveCount">0</b></div>
    </header>

    <section class="game-card">
      <p class="goal">把「曹操」移到最下方中央出口。</p>

      <div class="board-shell">
        <div id="board" class="board" aria-label="華容道棋盤"></div>
      </div>

      <div class="selected-info">
        已選：<b id="selectedName">尚未選擇</b>
      </div>

      <div class="dpad" aria-label="方向控制">
        <span></span>
        <button class="dir-btn slowly-press" type="button" data-dir="up" aria-label="向上">▲</button>
        <span></span>

        <button class="dir-btn slowly-press" type="button" data-dir="left" aria-label="向左">◀</button>
        <button class="dir-btn center-btn slowly-press" id="undoBtn" type="button" aria-label="復原一步">↶</button>
        <button class="dir-btn slowly-press" type="button" data-dir="right" aria-label="向右">▶</button>

        <span></span>
        <button class="dir-btn slowly-press" type="button" data-dir="down" aria-label="向下">▼</button>
        <span></span>
      </div>

      <div class="actions">
        <button class="action-btn slowly-press" id="resetBtn" type="button">重來</button>
      </div>

      <p class="help">
        點一個方塊選中，再按方向鍵移動。方塊不能穿過其他方塊。電腦也可用方向鍵／WASD，Z 復原。
      </p>
    </section>
  </main>


  <div id="resetConfirm" class="confirm-overlay" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="resetConfirmTitle">
      <strong id="resetConfirmTitle">確定要重來嗎？</strong>
      <p id="resetConfirmText">目前的進度會全部清空。</p>

      <div class="confirm-actions">
        <button id="cancelResetBtn" class="confirm-btn cancel slowly-press" type="button">取消</button>
        <button id="confirmResetBtn" class="confirm-btn danger slowly-press" type="button">確定重來</button>
      </div>
    </div>
  </div>

  <div id="toast" class="slowly-toast game-toast" role="status" aria-live="polite"></div>

  <script src="https://lib.stillnessbyslowly.com/ui/toast.js"></script>
  <script src="./huarong_v1.js"></script>
</body>
</html>
