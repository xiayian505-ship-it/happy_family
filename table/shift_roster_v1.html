<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>櫃檯人員排班紀錄表</title>
  <link rel="stylesheet" href="shift_roster_v1.css">
</head>
<body>
  <div class="controls" aria-label="排班表操作">
    <div class="controls-row controls-date-row" aria-label="月份控制">
      <button id="prevMonth" type="button">‹ 上月</button>

      <label class="date-control">
        <span>年</span>
        <input id="yearInput" type="number" min="2000" max="2100" value="2026" inputmode="numeric">
      </label>

      <label class="date-control">
        <span>月</span>
        <select id="monthSelect"></select>
      </label>

      <button id="nextMonth" type="button">下月 ›</button>
    </div>

    <div class="controls-row controls-mode-row" aria-label="標記與檢查">
      <button id="blockModeButton" type="button" aria-pressed="false">禁休</button>
      <button id="specialModeButton" type="button" aria-pressed="false">特殊</button>
      <button id="nightModeButton" type="button" aria-pressed="false">大夜</button>
      <button id="leaveCheckButton" type="button">排假檢查</button>
    </div>

    <div class="controls-row controls-action-row" aria-label="其他操作">
      <button id="clearMonthButton" type="button">本月清空</button>
      <button id="printButton" type="button">列印</button>
      <button id="exportPngButton" type="button">匯出 PNG</button>
    </div>
  </div>

  <div id="rowFillBar" class="row-fill-bar" hidden aria-live="polite">
    <div class="row-fill-head">
      <strong id="rowFillTitle">整列填入</strong>
      <button id="rowFillClose" class="row-fill-close" type="button" aria-label="關閉">×</button>
    </div>

    <div id="rowFillQuickLetters" class="row-fill-quick" aria-label="快速選擇英文字母"></div>

    <div class="row-fill-custom">
      <label>其他
        <input id="rowFillCustomInput" type="text" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="其他英文字母">
      </label>
      <button id="rowFillApplyCustom" type="button">套用</button>
      <button id="rowFillClearRow" type="button">清空整列</button>
    </div>
  </div>

  <div id="conflictDialog" class="conflict-dialog" hidden>
    <div class="conflict-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="conflictDialogMessage">
      <p id="conflictDialogMessage" class="conflict-dialog-message"></p>
      <div class="conflict-dialog-actions">
        <button id="conflictChooseSchedule" type="button">排班</button>
        <button id="conflictChooseVacation" type="button">休假</button>
      </div>
    </div>
  </div>


  <div id="clearMonthDialog" class="clear-month-dialog" hidden>
    <div class="clear-month-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="clearMonthDialogMessage">
      <p id="clearMonthDialogMessage" class="clear-month-dialog-message"></p>
      <div class="clear-month-dialog-actions">
        <button id="clearMonthCancel" type="button">取消</button>
        <button id="clearMonthConfirm" type="button">清空</button>
      </div>
    </div>
  </div>

  <div id="leaveCheckDialog" class="leave-check-dialog" hidden>
    <div class="leave-check-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="leaveCheckMessage">
      <p id="leaveCheckMessage" class="leave-check-message"></p>
      <div id="leaveCheckActions" class="leave-check-actions">
        <button id="leaveCheckCorrect" type="button">正確</button>
        <button id="leaveCheckIncorrect" type="button">不正確</button>
      </div>
    </div>
  </div>

  <main class="sheet" id="sheet">
    <header class="sheet-title">
      <div class="sheet-month"><span id="titleYear">2026</span> 年 <span id="titleMonth">11</span> 月</div>
      <h1>櫃檯人員排班紀錄表</h1>
      <div class="sheet-spacer" aria-hidden="true"></div>
    </header>

    <div class="sheet-body">
      <div class="sheet-main">
        <table class="schedule-table" id="scheduleTable" aria-label="排班表"></table>
        <table class="lower-table" id="lowerTable" aria-label="姓名與月曆空白表"></table>
        <div class="summary-grid" id="summaryGrid" aria-label="休假統計"></div>
      </div>

      <aside class="side-note" aria-label="排假說明">
        <span class="side-note-text">請每人先各排</span>
        <span id="publicLeaveInput" class="side-note-number" contenteditable="true" role="textbox" inputmode="numeric" aria-label="每人公休天數">8</span>
        <span class="side-note-text">天月假，等大家全部都排完再排特休。</span>
      </aside>
    </div>
  </main>

  <script src="shift_roster_v1.js"></script>
  <script src="shift_roster_export.js"></script>
</body>
</html>
